<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Contact - Simple Web App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- SSO Login Section -->
        <div class="form-card section">
            <h1>Login</h1>
            
            <div id="ssoSuccessMessage" class="success-message"></div>
            
            <!-- SSO Login Button -->
            <button type="button" id="ssoLoginBtn" class="btn btn-primary">
                Login with SSO
            </button>
            
            <!-- Traditional Login Form -->
            <div class="divider">
                <span>or</span>
            </div>
            
            <form id="loginForm" class="form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        required 
                        placeholder="Enter your email"
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required 
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>
                <button type="submit" class="btn btn-primary">Login</button>
            </form>
        </div>

        <!-- Contact Form Section -->
        <div class="form-card section">
            <h1>Contact Us</h1>
            
            <div id="contactSuccessMessage" class="success-message"></div>
            
            <form id="contactForm" class="form">
                <div class="form-group">
                    <label for="contactName">Name</label>
                    <input 
                        type="text" 
                        id="contactName" 
                        name="name" 
                        required 
                        placeholder="Enter your name"
                        autocomplete="name"
                    >
                </div>
                <div class="form-group">
                    <label for="contactEmail">Email</label>
                    <input 
                        type="email" 
                        id="contactEmail" 
                        name="email" 
                        required 
                        placeholder="Enter your email"
                        autocomplete="email"
                    >
                </div>
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input 
                        type="text" 
                        id="subject" 
                        name="subject" 
                        required 
                        placeholder="Enter subject"
                    >
                </div>
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea 
                        id="message" 
                        name="message" 
                        required 
                        placeholder="Enter your message"
                        rows="5"
                    ></textarea>
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>
    
    <script src="auth/sso.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
