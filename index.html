<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your account">
  <title>Login — Welcome Back</title>
  
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Theme initialization (before first paint to prevent FOUC) -->
  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('theme');
        const systemPreference = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        const initialTheme = savedTheme || systemPreference;
        document.documentElement.setAttribute('data-theme', initialTheme);
      } catch (error) {
        // Fallback to light theme if localStorage fails
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="theme-toggle.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  
  <!-- Theme Toggle Button -->
  <button 
    type="button" 
    class="theme-toggle" 
    id="themeToggle"
    aria-label="Switch to dark mode"
    aria-pressed="false"
  >
    <!-- Sun Icon (Light Mode) -->
    <svg class="theme-toggle-icon visible" id="sunIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <circle cx="12" cy="12" r="4"/>
      <path d="M12 2v2"/>
      <path d="M12 20v2"/>
      <path d="m4.93 4.93 1.41 1.41"/>
      <path d="m17.66 17.66 1.41 1.41"/>
      <path d="M2 12h2"/>
      <path d="M20 12h2"/>
      <path d="m6.34 17.66-1.41 1.41"/>
      <path d="m19.07 4.93-1.41 1.41"/>
    </svg>
    
    <!-- Moon Icon (Dark Mode) - Hidden by default -->
    <svg class="theme-toggle-icon hidden" id="moonIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>
    </svg>
  </button>
  
  <!-- Screen Reader Announcement -->
  <div class="sr-only" role="status" aria-live="polite" aria-atomic="true" id="themeAnnouncement"></div>
  
  <!-- Login Form -->
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <h1 class="login-title">Welcome back</h1>
        <p class="login-subtitle">Sign in to your account to continue</p>
      </div>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input 
            type="email" 
            id="email" 
            name="email" 
            class="form-input" 
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
          <p class="form-helper">We'll never share your email with anyone else.</p>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">Password</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            class="form-input" 
            placeholder="Enter your password"
            required
            autocomplete="current-password"
          >
        </div>
        
        <div class="form-actions">
          <button type="submit" class="btn-primary">Sign in</button>
        </div>
      </form>
      
      <div class="form-footer">
        Don't have an account? <a href="#" class="form-link">Sign up</a>
      </div>
    </div>
  </div>
  
  <!-- Scripts -->
  <script src="theme-toggle.js"></script>
  <script src="app.js"></script>
  
</body>
</html>
