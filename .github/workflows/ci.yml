name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint HTML & JS
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: npm install --save-dev htmlhint eslint @eslint/js globals

      - name: Lint HTML
        run: npx htmlhint index.html

      - name: Lint JS
        run: npx eslint app.js
