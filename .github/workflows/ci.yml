###############################################################################
# CI — runs on every PR to main
# Gates: lint → type-check → unit tests → build
# All jobs must be green before a PR can merge (enforced by branch protection).
###############################################################################
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]   # also run on direct pushes (post-merge)

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true   # cancel stale runs when new commits are pushed

env:
  NODE_VERSION: "20"
  # Prisma needs a DATABASE_URL to generate the client; point it at a test DB.
  DATABASE_URL: "postgresql://ecom_user:ecom_pass@localhost:5432/ecom_ci?schema=public"

jobs:
  # ─── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint across all workspaces
        run: npm run lint

      - name: Check Prettier formatting
        run: npm run format:check

  # ─── 2. Type-check ──────────────────────────────────────────────────────────
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     ecom_user
          POSTGRES_PASSWORD: ecom_pass
          POSTGRES_DB:       ecom_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecom_user -d ecom_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: packages/db

      - name: TypeScript — strict type-check (all workspaces)
        run: npm run type-check

  # ─── 3. Unit tests ──────────────────────────────────────────────────────────
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    needs: type-check
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     ecom_user
          POSTGRES_PASSWORD: ecom_pass
          POSTGRES_DB:       ecom_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecom_user -d ecom_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REDIS_URL: "redis://localhost:6379"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: packages/db

      - name: Run unit tests
        run: npm run test

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: "**/coverage/**"
          if-no-files-found: ignore

  # ─── 4. Build ───────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     ecom_user
          POSTGRES_PASSWORD: ecom_pass
          POSTGRES_DB:       ecom_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecom_user -d ecom_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate
        working-directory: packages/db

      - name: Build all workspaces (Turbo)
        run: npm run build
        env:
          # Next.js needs NEXTAUTH_SECRET at build time for some route handlers
          NEXTAUTH_SECRET: "ci-placeholder-not-a-real-secret"
          NEXTAUTH_URL:    "http://localhost:3000"
          NEXT_PUBLIC_APP_URL: "http://localhost:3000"

      - name: Upload Next.js build artefact
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: apps/web/.next
          if-no-files-found: warn
